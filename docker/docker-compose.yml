version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixloop_db}
      POSTGRES_USER: ${POSTGRES_USER:-fixloop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixloop_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixloop_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixloop_user} -d ${POSTGRES_DB:-fixloop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fixloop_pgdata:
    driver: local
